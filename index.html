<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocalBridge AI - Advanced Real-Time Voice Translator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-effect {
            box-shadow: 0 0 40px -10px rgba(99, 102, 241, 0.3);
        }
        .mic-pulse {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex flex-col items-center justify-center p-4 relative overflow-hidden">
        <!-- Background Futuristic Blur Circles -->
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Main Container -->
        <main class="w-full max-w-4xl glass-card rounded-3xl p-6 md:p-10 glow-effect z-10">
            <!-- Header -->
            <header class="text-center mb-8">
                <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 text-sm font-medium mb-3">
                    <i class="fa-solid fa-bolt me-1"></i> Real-Time AI Powered Translation
                </div>
                <h1 class="text-4xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">
                    VocalBridge AI
                </h1>
                <p class="text-slate-400 mt-2 text-sm md:text-base">Break language barriers instantly with speech and text translation across 30+ languages.</p>
            </header>

            <!-- Translation Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Input Panel -->
                <div class="flex flex-col gap-3">
                    <div class="flex justify-between items-center px-1">
                        <label class="text-xs uppercase tracking-wider text-slate-400 font-semibold">From Language</label>
                        <select id="fromLang" class="bg-slate-800 text-slate-200 border border-slate-700 text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500 transition-all cursor-pointer">
                        </select>
                    </div>
                    <div class="relative">
                        <textarea id="inputText" placeholder="Speak or type your text here..." class="w-full h-48 bg-slate-900/80 border border-slate-800 rounded-2xl p-4 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500/50 resize-none transition-all text-lg"></textarea>
                        
                        <!-- Action Buttons Inside Textarea -->
                        <div class="absolute bottom-3 right-3 flex items-center gap-2">
                            <button id="micBtn" title="Speak Input" class="w-10 h-10 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center transition-all shadow-lg shadow-indigo-600/30">
                                <i class="fa-solid fa-microphone"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Output Panel -->
                <div class="flex flex-col gap-3">
                    <div class="flex justify-between items-center px-1">
                        <label class="text-xs uppercase tracking-wider text-slate-400 font-semibold">To Language</label>
                        <select id="toLang" class="bg-slate-800 text-slate-200 border border-slate-700 text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500 transition-all cursor-pointer">
                        </select>
                    </div>
                    <div class="relative">
                        <textarea id="outputText" readonly placeholder="Translation will appear here..." class="w-full h-48 bg-slate-900/40 border border-slate-800 rounded-2xl p-4 text-indigo-300 placeholder-slate-600 focus:outline-none resize-none text-lg font-medium"></textarea>
                        
                        <!-- Action Buttons Inside Output Area -->
                        <div class="absolute bottom-3 right-3 flex items-center gap-2">
                            <button id="speakBtn" title="Listen Translation" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition-all">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                            <button id="copyBtn" title="Copy Translation" class="w-10 h-10 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center transition-all">
                                <i class="fa-solid fa-copy"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Controls Bar -->
            <div class="mt-8 flex flex-col sm:flex-row items-center justify-between gap-4 border-t border-slate-800/80 pt-6">
                <button id="swapBtn" class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium transition-all">
                    <i class="fa-solid fa-arrows-rotate"></i> Swap Languages
                </button>
                <button id="translateBtn" class="w-full sm:w-auto px-8 py-3 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold shadow-lg shadow-indigo-500/25 transition-all transform hover:-translate-y-0.5">
                    Translate Now
                </button>
            </div>
        </main>

        <footer class="mt-6 text-slate-500 text-xs z-10">
            Built with Web Speech API & Reliable Google Translation Engine
        </footer>
    </div>

    <!-- Application Script -->
    <script>
        const languages = {
            "ur": "Urdu",
            "ar": "Arabic",
            "en": "English",
            "hi": "Hindi",
            "tr": "Turkish",
            "es": "Spanish",
            "fr": "French",
            "de": "German",
            "it": "Italian",
            "zh-CN": "Chinese",
            "ja": "Japanese",
            "ko": "Korean",
            "ru": "Russian",
            "pt": "Portuguese",
            "nl": "Dutch",
            "fa": "Persian",
            "id": "Indonesian",
            "ms": "Malay",
            "bn": "Bengali",
            "pa": "Punjabi",
            "ta": "Tamil",
            "th": "Thai",
            "vi": "Vietnamese",
            "el": "Greek",
            "sv": "Swedish",
            "no": "Norwegian",
            "da": "Danish",
            "fi": "Finnish",
            "pl": "Polish",
            "uk": "Ukrainian",
            "cs": "Czech"
        };

        const speechLangCodes = {
            "ur": "ur-PK",
            "ar": "ar-SA",
            "en": "en-US",
            "hi": "hi-IN",
            "tr": "tr-TR",
            "es": "es-ES",
            "fr": "fr-FR"
        };

        const fromLangSelect = document.getElementById('fromLang');
        const toLangSelect = document.getElementById('toLang');
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const translateBtn = document.getElementById('translateBtn');
        const micBtn = document.getElementById('micBtn');
        const speakBtn = document.getElementById('speakBtn');
        const copyBtn = document.getElementById('copyBtn');
        const swapBtn = document.getElementById('swapBtn');

        // Populate Select Dropdowns
        Object.entries(languages).forEach(([code, name]) => {
            const opt1 = new Option(name, code);
            const opt2 = new Option(name, code);
            fromLangSelect.add(opt1);
            toLangSelect.add(opt2);
        });

        // Set Defaults: Urdu to Arabic
        fromLangSelect.value = "ur";
        toLangSelect.value = "ar";

        // Highly Reliable Google Translate Free Endpoint Function
        async function translateText() {
            const text = inputText.value.trim();
            if (!text) {
                outputText.value = "";
                return;
            }

            outputText.placeholder = "Translating...";
            const sourceLang = fromLangSelect.value;
            const targetLang = toLangSelect.value;

            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLang}&tl=${targetLang}&dt=t&q=${encodeURIComponent(text)}`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                // Parse returned translated chunks
                let translatedResult = "";
                if (data && data[0]) {
                    data[0].forEach(item => {
                        if (item[0]) translatedResult += item[0];
                    });
                }
                
                outputText.value = translatedResult || "Translation failed.";
            } catch (error) {
                console.error("Translation Error:", error);
                outputText.value = "Error connecting to translation service. Please check your internet connection.";
            }
        }

        // Voice Recognition (Speech to Text)
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            
            micBtn.addEventListener('click', () => {
                const langCode = fromLangSelect.value;
                recognition.lang = speechLangCodes[langCode] || langCode;
                recognition.start();
                micBtn.classList.add('mic-pulse', 'bg-red-600');
            });

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                inputText.value = transcript;
                micBtn.classList.remove('mic-pulse', 'bg-red-600');
                translateText();
            };

            recognition.onerror = () => {
                micBtn.classList.remove('mic-pulse', 'bg-red-600');
            };

            recognition.onend = () => {
                micBtn.classList.remove('mic-pulse', 'bg-red-600');
            };
        } else {
            micBtn.title = "Speech Recognition not supported in this browser";
        }

        // Text to Speech (Audio Playback)
        speakBtn.addEventListener('click', () => {
            const text = outputText.value;
            if (!text) return;
            const utterance = new SpeechSynthesisUtterance(text);
            const langCode = toLangSelect.value;
            utterance.lang = speechLangCodes[langCode] || langCode;
            window.speechSynthesis.speak(utterance);
        });

        // Swap Languages
        swapBtn.addEventListener('click', () => {
            const tempLang = fromLangSelect.value;
            fromLangSelect.value = toLangSelect.value;
            toLangSelect.value = tempLang;

            const tempText = inputText.value;
            inputText.value = outputText.value;
            outputText.value = tempText;

            if (inputText.value.trim() !== "") {
                translateText();
            }
        });

        // Copy Text
        copyBtn.addEventListener('click', () => {
            if (outputText.value) {
                navigator.clipboard.writeText(outputText.value);
                alert("Translation copied to clipboard!");
            }
        });

        // Translate Event Listeners
        translateBtn.addEventListener('click', translateText);
        
        // Auto-translate on typing (with debounce)
        let timer;
        inputText.addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
                translateText();
            }, 600);
        });
    </script>
</body>
</html>
